# Settings for hilands_crawl.py. Edit here, run with no arguments.

# --- what to look for ---
categories: 0          # how many brand categories to crawl. 0 = all of them
min_discount: 40        # only keep items at least this % off. 0 = keep everything
min_pack: 5             # smallest pack to keep. 5 skips singles. 1 = keep singles
max_price: 99.99            # price cap in dollars. leave blank for no cap

# --- what to skip ---
include_out_of_stock: false
allow_backorder: false
include_unknown_pack: false   # keep items whose pack size could not be read

# --- how hard to hit the site ---
workers: 4              # concurrent requests. 4 is polite for a small shop
delay: 0.5              # minimum seconds between requests, counted across all workers

# --- output ---
output: cigars.csv

# --- diagnostics ---
inspect: 0              # set to 5 to print raw pack labels and stop, without crawling

name: Cigora deal alert

# GMAIL_PASSWORD must be set under
#   Settings > Secrets and variables > Actions > New repository secret
# using a Gmail App Password, not your account password.
# Sender/recipient are set as constants in cigora_deal_alert.py.

on:
  workflow_dispatch:

jobs:
  check-deals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 curl_cffi

      - name: Run deal alert
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python cigora_deal_alert.py --min-discount 33.333 --max-price 125

      - name: Commit updated history file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # First run may not have created the file yet; start it empty.
          [ -f cigora_sent_history.json ] || echo '{}' > cigora_sent_history.json
          git add cigora_sent_history.json
          git diff --staged --quiet || git commit -m "Update sent history [skip ci]"
          # Other workflows push to main too; pull their commits first so this
          # push isn't rejected as out of date. Retries in case two land at once.
          pushed=no
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=yes; break; fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying..."; sleep $((i * 10))
          done
          [ "$pushed" = yes ] || { echo "Push failed after 3 attempts"; exit 1; }
name: Cigora deal alert (disabled)

# Runs on the home Windows PC (a self-hosted runner labelled "home-cigars"),
# not on GitHub's servers: cigora.com answers GitHub's servers with Cloudflare's
# challenge page, which even a real browser can't get past from there.
# Setup steps are in README.md under "Home runner".
#
# GMAIL_PASSWORD must be set under
#   Settings > Secrets and variables > Actions > New repository secret
# using a Gmail App Password, not your account password.

# Disabled: no schedule. It can still be run by hand from the Actions tab.
# To turn it back on, restore:
#   schedule:
#     - cron: "58 22 * * *"   # 4:58 PM Denver (MDT), 3:58 PM (MST)
on:
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  check-deals:
    runs-on: [self-hosted, Windows, home-cigars]
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    env:
      # Product names can contain characters like n-tilde; make Python's
      # output UTF-8 so Windows' default code page can't crash the run.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        # Uses the Python installed on the PC for all users (Administrator
        # PowerShell: winget install -e --id Python.Python.3.12 --scope machine),
        # in a private environment the runner can install packages into.
        # (actions/setup-python's own builds fail to install on this PC.)
        run: |
          $ErrorActionPreference = "Continue"
          $py = @("$env:ProgramFiles\Python312\python.exe", "$env:ProgramFiles\Python313\python.exe") |
                Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $py) {
            $cmd = Get-Command python -ErrorAction SilentlyContinue
            if ($cmd -and $cmd.Source -notlike "*WindowsApps*") { $py = $cmd.Source }
          }
          if (-not $py) {
            Write-Host "Python isn't installed for all users on this PC. In an Administrator PowerShell run:"
            Write-Host "  winget install -e --id Python.Python.3.12 --scope machine"
            exit 1
          }
          Write-Host "Using $py"
          $venv = Join-Path $env:RUNNER_TOOL_CACHE "cigars-venv"
          if (-not (Test-Path (Join-Path $venv "Scripts\python.exe"))) {
            & $py -m venv $venv
            if ($LASTEXITCODE -ne 0) { Write-Host "Couldn't create $venv"; exit 1 }
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $venv "Scripts")
          & (Join-Path $venv "Scripts\python.exe") --version
          exit $LASTEXITCODE

      - name: Install dependencies
        run: |
          $ErrorActionPreference = "Continue"
          python -m pip install --upgrade --quiet requests beautifulsoup4 curl_cffi playwright
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Only used if the site still challenges a plain request: the shared
          # code falls back to Google Chrome, or to this Chromium if Chrome
          # isn't installed. Skips the download once it's there.
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { Write-Host "Chromium install failed; Chrome or plain requests will be used." }
          exit 0

      - name: Run deal alert
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: |
          python cigora_deal_alert.py --min-discount 30 --max-price 150
          exit $LASTEXITCODE

      - name: Commit updated history file
        run: |
          $ErrorActionPreference = "Continue"   # git reports progress on stderr
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $hist = "cigora_sent_history.json"
          # First run may not have created the file yet; start it empty.
          if (-not (Test-Path $hist)) { [IO.File]::WriteAllText((Join-Path $PWD $hist), "{}") }
          git add $hist
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No history changes."; exit 0 }
          git commit -m "Update Cigora sent history [skip ci]"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Other workflows push to main too; pull their commits first so this
          # push isn't rejected as out of date. Retries in case two land at once.
          $pushed = $false
          foreach ($i in 1..3) {
            git pull --rebase origin main
            if ($LASTEXITCODE -eq 0) {
              git push
              if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            } else {
              git rebase --abort
            }
            Write-Host "Push attempt $i failed, retrying..."
            Start-Sleep -Seconds (10 * $i)
          }
          if (-not $pushed) { Write-Host "Push failed after 3 attempts"; exit 1 }
          exit 0

      - name: Share debug page if nothing was read
        # When a run reads nothing, the script saves the last page it loaded
        # in debug/. Push it to the debug-pages branch so it can be inspected.
        if: failure()
        run: |
          $ErrorActionPreference = "Continue"
          if (-not (Test-Path debug)) { Write-Host "No debug page saved."; exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-pages
          git add -f debug
          git commit -m "Debug page from a failed Cigora run [skip ci]"
          git push -f origin debug-pages
          if ($LASTEXITCODE -ne 0) { Write-Host "Couldn't push the debug page."; exit 0 }
          Write-Host "Saved to the debug-pages branch."
          exit 0

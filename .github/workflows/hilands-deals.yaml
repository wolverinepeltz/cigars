name: hilands cigar deala

# Settings live in config.yml, not here.

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays, 13:17 UTC
  workflow_dispatch:

concurrency:
  group: hilands-deals
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl
        run: |
          set -o pipefail
          python hilands_crawl.py 2>&1 | tee run.log

      - name: Build run summary
        run: |
          {
            echo "## Hiland's deals"
            echo
            echo "Rows: $(($(wc -l < cigars.csv) - 1))"
            echo
            if grep -q '>>>' run.log; then
              echo "### Found"
              echo '```'
              grep -A1 '>>>' run.log | sed 's/^ *//'
              echo '```'
            else
              echo "Nothing over the threshold this week."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CSV and log
        uses: actions/upload-artifact@v4
        with:
          name: cigars-${{ github.run_number }}
          path: |
            cigars.csv
            run.log
          retention-days: 90

      - name: Commit snapshot to data/
        run: |
          stamp=$(date -u +%Y-%m-%d)
          mkdir -p data
          cp cigars.csv "data/cigars-$stamp.csv"
          cp cigars.csv data/latest.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No change since last run."
          else
            git commit -m "data: crawl $stamp"
            git push
          fi

      - name: Open an issue for the deals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q '>>>' run.log; then
            echo "Nothing to report."
            exit 0
          fi
          {
            echo "Found by the crawl on $(date -u +%Y-%m-%d)."
            echo
            echo '```'
            grep -A1 '>>>' run.log | sed 's/^ *//'
            echo '```'
            echo
            echo "Full CSV: [run $GITHUB_RUN_NUMBER artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > body.md
          gh label create deals --color EDEDED \
            --description "Automated deal reports" --force
          gh issue create \
            --title "Hiland's deals $(date -u +%Y-%m-%d)" \
            --body-file body.md \
            --label deals

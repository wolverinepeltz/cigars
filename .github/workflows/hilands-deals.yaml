name: hilands cigar deals

# All crawl settings live in config.yml, not here.
# GMAIL_PASSWORD must be set under
#   Settings > Secrets and variables > Actions > New repository secret
# using a Gmail App Password, not your account password.

on:
  schedule:
    - cron: "17 13 * * *"   # Mondays, 13:17 UTC
  workflow_dispatch:

concurrency:
  group: hilands-deals
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl and email
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: |
          set -o pipefail
          python hilands_crawl.py 2>&1 | tee run.log

      - name: Build run summary
        if: always()
        run: |
          {
            echo "## Hiland's deals"
            echo
            if [ -f cigars.csv ]; then
              echo "Qualifying: $(($(wc -l < cigars.csv) - 1))"
              echo "Changed today: $(($(wc -l < cigars-changes.csv) - 1))"
              echo
            fi
            if grep -q '>>>' run.log; then
              echo '```'
              grep -A1 '>>>' run.log | sed 's/^ *//'
              echo '```'
            else
              echo "Nothing found this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CSVs and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hilands-${{ github.run_number }}
          path: |
            cigars.csv
            cigars-changes.csv
            run.log
          if-no-files-found: warn
          retention-days: 90

      - name: Commit snapshot to data/
        run: |
          stamp=$(date -u +%Y-%m-%d)
          mkdir -p data
          # The script already wrote data/latest.csv, its own baseline.
          # These are just dated copies for history.
          cp cigars.csv "data/cigars-$stamp.csv"
          cp cigars-changes.csv "data/changes-$stamp.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No change since last run."
          else
            git commit -m "data: crawl $stamp"
            git push
          fi

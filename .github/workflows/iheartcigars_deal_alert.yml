name: iHeartCigars deal alert

# GMAIL_PASSWORD must be set under
#   Settings > Secrets and variables > Actions > New repository secret
# using a Gmail App Password, not your account password.
# Store settings are in iheartcigars_deal_alert.py; shared logic is in dealalerts/.

on:
  schedule:
    # 2:38 PM Denver in winter (MST), 3:38 PM in summer (MDT). Cron is UTC.
    - cron: "38 21 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  check-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests curl_cffi

      - name: Run deal alert
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python iheartcigars_deal_alert.py --min-discount 30 --max-price 150

      - name: Commit updated history file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f iheartcigars_sent_history.json ] || echo '{}' > iheartcigars_sent_history.json
          git add iheartcigars_sent_history.json
          git diff --staged --quiet && exit 0
          git commit -m "Update iHeartCigars sent history [skip ci]"
          # Other workflows push to main too; pull their commits first so this
          # push isn't rejected as out of date. Retries in case two land at once.
          pushed=no
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=yes; break; fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying..."; sleep $((i * 10))
          done
          [ "$pushed" = yes ] || { echo "Push failed after 3 attempts"; exit 1; }

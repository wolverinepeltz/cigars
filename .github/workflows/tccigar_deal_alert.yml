name: TC Cigar deal alert

# GMAIL_PASSWORD must be set under
#   Settings > Secrets and variables > Actions > New repository secret
# using a Gmail App Password, not your account password.
# Sender/recipient are set in dealalerts/emailfmt.py.

on:
  schedule:
    # 12:23 PM Denver in winter (MST), 1:23 PM in summer (MDT). Cron is UTC.
    - cron: "23 19 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  check-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests curl_cffi

      - name: Run deal alert
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python tccigar_deal_alert.py --min-discount 30 --max-price 150

      - name: Commit updated history file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f tccigar_sent_history.json ] || echo '{}' > tccigar_sent_history.json
          git add tccigar_sent_history.json
          git diff --staged --quiet || git commit -m "Update TC Cigar sent history [skip ci]"
          git pull --rebase origin main
          git push

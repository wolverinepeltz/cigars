name: Cigar Deal Scraper (Smoking Hub, disabled)

# Disabled: no schedule. It can still be run by hand from the Actions tab.
# To turn it back on, restore:
#   schedule:
#     - cron: "8 22 * * *"   # 4:08 PM Denver (MDT), 3:08 PM (MST)
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run scraper
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python scraper.py

      - name: Commit updated state files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state.json sent_history.json blacklist.json || true
          git diff --cached --quiet || git commit -m "Update scraper state"

          git pull --rebase origin main
          git push

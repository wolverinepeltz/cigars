name: Cigar Deal Scraper

on:
  schedule:
    # 5:28 AM Denver in summer (MDT), 4:28 AM in winter (MST).
    # Cron is UTC. Workflows run 30 min apart; last one 6:28 AM at the latest.
    - cron: "28 11 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run scraper
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python scraper.py

      - name: Commit updated state files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state.json sent_history.json blacklist.json || true
          git diff --cached --quiet || git commit -m "Update scraper state"

          git pull --rebase origin main
          git push

name: Perfect Cigar Blend deal alert

# GMAIL_PASSWORD must be set under
#   Settings > Secrets and variables > Actions > New repository secret
# using a Gmail App Password, not your account password.
# Sender/recipient are set as constants in pcb_deal_alert.py.

# Manual-only for now: since about Oct 13, perfectcigarblend.com answers
# GitHub's servers with Cloudflare's challenge page, and even a real Chrome
# can't get past it from here. To put it back on the schedule (e.g. once it
# runs from a computer at home), restore:
#   schedule:
#     - cron: "58 21 * * *"   # 3:58 PM Denver (MDT), 2:58 PM (MST)
on:
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  check-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # playwright drives the Google Chrome already on GitHub's runners, for
        # Cloudflare's "Just a moment..." check. xvfb gives Chrome a virtual
        # screen, since a visible browser gets past the check more often.
        run: |
          pip install requests beautifulsoup4 curl_cffi playwright
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)

      - name: Run deal alert
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: xvfb-run -a python pcb_deal_alert.py --min-discount 33 --max-price 125

      - name: Commit updated history file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # First run may not have created the file yet; start it empty.
          [ -f pcb_sent_history.json ] || echo '{}' > pcb_sent_history.json
          git add pcb_sent_history.json
          git diff --staged --quiet || git commit -m "Update sent history [skip ci]"
          # Other workflows push to main too; pull their commits first so this
          # push isn't rejected as out of date. Retries in case two land at once.
          pushed=no
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=yes; break; fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying..."; sleep $((i * 10))
          done
          [ "$pushed" = yes ] || { echo "Push failed after 3 attempts"; exit 1; }

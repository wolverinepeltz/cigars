name: Smoke Inn deal alert

# Uses the same GMAIL_PASSWORD secret as the other deal-alert workflow.
# Sender/recipient are set as constants in smokeinn_deal_alert.py.

on:
  schedule:
    # 3:38 PM Denver in summer (MDT), 2:38 PM in winter (MST). Cron is UTC.
    # Mid-afternoon Denver has the shortest GitHub scheduling delays.
    - cron: "38 21 * * *"
  workflow_dispatch:
    inputs:
      full_catalog:
        description: "Also crawl the full ~1000-line catalog, not just Clearance"
        type: boolean
        default: true
      max_lines:
        description: "Cap on line pages to scan (blank = no cap, full run)"
        type: string
        default: ""

jobs:
  check-deals:
    runs-on: ubuntu-latest
    # Full-catalog mode does ~1000 requests at a 1s delay - roughly 20-30
    # minutes. Clearance-only is well under a minute. Adjust if needed.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run deal alert (scheduled - Clearance + full catalog)
        if: github.event_name == 'schedule'
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python smokeinn_deal_alert.py --min-discount 33 --max-price 125 --full-catalog

      - name: Run deal alert (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: |
          ARGS="--min-discount 40 --max-price 125"
          if [ "${{ github.event.inputs.full_catalog }}" = "true" ]; then
            ARGS="$ARGS --full-catalog"
          fi
          if [ -n "${{ github.event.inputs.max_lines }}" ]; then
            ARGS="$ARGS --max-lines ${{ github.event.inputs.max_lines }}"
          fi
          python smokeinn_deal_alert.py $ARGS

      - name: Commit updated history file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f smokeinn_sent_history.json ] || echo '{}' > smokeinn_sent_history.json
          git add smokeinn_sent_history.json
          git diff --staged --quiet || git commit -m "Update Smoke Inn sent history [skip ci]"
          # Other workflows push to main too; pull their commits first so this
          # push isn't rejected as out of date. Retries in case two land at once.
          pushed=no
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=yes; break; fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying..."; sleep $((i * 10))
          done
          [ "$pushed" = yes ] || { echo "Push failed after 3 attempts"; exit 1; }

name: GT Cigars deal alert

# GMAIL_PASSWORD must be set under
#   Settings > Secrets and variables > Actions > New repository secret
# using a Gmail App Password, not your account password.
# Sender/recipient are set as constants in gtcigars_deal_alert.py.

on:
  schedule:
    # 08:00 UTC daily, clear of the other scrapers' slots. Cron is UTC.
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  check-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run deal alert
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: python gtcigars_deal_alert.py --min-discount 35 --max-price 125 --alt-min-discount 25 --alt-min-price 100 --alt-max-price 125

      - name: Commit updated history file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f gtcigars_sent_history.json ] || echo '{}' > gtcigars_sent_history.json
          git add gtcigars_sent_history.json
          git diff --staged --quiet || git commit -m "Update GT Cigars sent history [skip ci]"
          git pull --rebase origin main
          git push
